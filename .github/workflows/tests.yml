name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [tests, board/tests, skills/job-apply-fleet/tests, prep_extract/tests, node]
    name: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Light install: the core requirements plus pytest/httpx. No Playwright, so the extractor's
      # browser tests skip themselves with a reason; everything else runs.
      - run: pip install -r requirements-dev.txt
      - name: pytest ${{ matrix.suite }}
        if: matrix.suite != 'node'
        timeout-minutes: 6
        run: python -u -m pytest ${{ matrix.suite }} -v -p no:cacheprovider -o faulthandler_timeout=60 < /dev/null
      - name: node --test board/tests_js
        if: matrix.suite == 'node'
        timeout-minutes: 6
        run: node --test board/tests_js/jobs.test.js board/tests_js/jobs_scoring.test.js < /dev/null
