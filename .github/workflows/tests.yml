name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Light install: the core requirements plus pytest/httpx. No Playwright, so the extractor's
      # browser tests skip themselves with a reason; everything else runs.
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        timeout-minutes: 12
        shell: bash
        run: python -u scripts/run_tests.py --verbose 2>&1 | tee test-output.txt
      - name: Last test output
        if: always()
        shell: bash
        run: tail -n 150 test-output.txt || true
