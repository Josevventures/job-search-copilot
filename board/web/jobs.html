<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d0f">
<title>Jobs board</title>
<link rel="stylesheet" href="/board.css">
<style>
  /* Jobs board layout. Tokens and shared components come from /board.css (web/board.css); only this page's layout
     lives here. Logic is in /jobs.js (pure, tested). */
  body { padding-bottom: calc(32px + env(safe-area-inset-bottom)); }
  body.has-snacks { padding-bottom: calc(220px + env(safe-area-inset-bottom)); }
  a { color: var(--accent); }

  .rank-btn { flex: 0 1 auto; min-width: 0; max-width: 52%; min-height: 40px; padding: 0 14px; border-radius: 20px; background: var(--surface-2);
    color: var(--text-2); font-size: var(--fs-small); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank-btn:hover { background: var(--surface-3); color: var(--text); }
  .rank-btn.dirty { color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn); }

  /* Focus view (2026-10-29): view-only re-sort of the ranked board by one factor */
  .focus-row { display: flex; align-items: center; gap: 8px; padding-top: 12px; flex-wrap: wrap; }
  .focus-row label { font-size: var(--fs-small); color: var(--text-2); }
  .focus-row select { min-height: 40px; padding: 0 12px; border: 0; border-radius: var(--radius-sm); background: var(--surface-2);
    color: var(--text); font: inherit; font-size: var(--fs-small); }
  .focus-row .chip { min-height: 40px; }
  .focusline { font-size: var(--fs-small); color: var(--text); padding-left: 10px; box-shadow: inset 2px 0 0 var(--accent); overflow-wrap: anywhere; }
  .focusline b { font-weight: 600; color: var(--accent); }
  .lead .focusline { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  .dupes .btn { justify-content: flex-start; text-align: left; overflow-wrap: anywhere; }

  .toolbar { display: flex; flex-direction: column; gap: 12px; padding-top: 4px; }
  .toolbar .chips { margin: 0 -16px; padding: 0 16px 2px; }
  .toolbar .chip { flex: 0 0 auto; }
  .toolbar .chip .of { font-variant-numeric: tabular-nums; }

  #sections { display: flex; flex-direction: column; gap: 32px; padding-top: 24px; }
  .section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .section-title { display: flex; align-items: baseline; gap: 8px; font-size: var(--fs-title); font-weight: 600; letter-spacing: -0.01em; }
  .section-title .of { font-size: var(--fs-small); font-weight: 400; color: var(--text-3); }
  .band-head { display: flex; align-items: center; gap: 8px; width: 100%; min-height: var(--tap); padding: 0 4px; text-align: left;
    font-size: var(--fs-small); color: var(--text-2); }
  .band-head b { color: var(--text); font-weight: 600; }
  .band-head .chev { margin-left: auto; width: 20px; height: 20px; transition: transform 200ms var(--ease); }
  .band-head[aria-expanded="false"] .chev { transform: rotate(-90deg); }
  .band-head[aria-expanded="false"] + .grid { display: none; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }

  /* lead card */
  .lead { gap: 10px; }
  .lead.pending { box-shadow: inset 0 0 0 1px var(--warn); }
  .lead-head { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; min-height: var(--tap); }
  .lead-head:hover .role { color: var(--accent); }
  .lead-head .titles { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .lead-head .chev { flex: 0 0 auto; width: 20px; height: 20px; color: var(--text-3); margin-top: 4px; }
  .role { font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .company { font-size: var(--fs-small); color: var(--text-2); overflow-wrap: anywhere; }
  .score { flex: 0 0 auto; min-width: 48px; height: 48px; padding: 0 6px; border-radius: var(--radius-sm); display: inline-flex; align-items: center; justify-content: center;
    gap: 2px; font-size: 20px; font-weight: 600; background: var(--accent-soft); color: var(--accent); }
  .score.worth_a_look { background: var(--warn-soft); color: var(--warn); }
  .score.low { background: var(--surface-2); color: var(--text-2); }
  .score .lock { font-size: 11px; }
  .meta { font-size: var(--fs-small); color: var(--text-2); overflow-wrap: anywhere; }
  .pay.estimated { color: var(--warn); }
  .meta .pill { margin-left: 6px; }
  .note { font-size: var(--fs-small); color: var(--warn); }
  .summary { font-size: 15px; color: var(--text); overflow-wrap: anywhere; }
  .lead .summary, .lead .whyrank { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .lead .network { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
  .badges .pill { white-space: normal; overflow-wrap: anywhere; }   /* a long badge (Possible duplicate of ...) wraps */
  .network { font-size: var(--fs-small); color: var(--text-2); padding-left: 10px; box-shadow: inset 2px 0 0 var(--text-3); overflow-wrap: anywhere; }
  .network.warm { color: var(--text); box-shadow: inset 2px 0 0 var(--good); }
  .whyrank { font-size: var(--fs-small); color: var(--text-2); overflow-wrap: anywhere; }
  .status { font-size: var(--fs-small); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; overflow-wrap: anywhere; }
  .status.pending { color: var(--warn); }
  .status.running { color: var(--accent); }
  .status.done { color: var(--good); }
  .status.failed, .status.permission { color: var(--danger); }
  .status.info { color: var(--text-2); }
  .status .btn { min-height: 40px; padding: 0 14px; font-size: var(--fs-small); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 4px; }
  .actions .btn { flex: 1 1 auto; min-width: 0; font-size: 15px; }
  .actions .btn.ghost { flex: 0 0 auto; display: inline-flex; align-items: center; text-decoration: none; }
  .move-hint { font-size: var(--fs-small); color: var(--warn); }

  /* lead details sheet */
  .detail-head { display: flex; align-items: flex-start; gap: 12px; }
  .detail-head .titles { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .detail-head .role { font-size: var(--fs-title); letter-spacing: -0.01em; }
  .fit { display: flex; flex-direction: column; gap: 2px; font-size: 15px; overflow-wrap: anywhere; }
  .fit b { font-size: var(--fs-small); font-weight: 500; color: var(--text-2); }
  .breakdown { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 4px 14px; font-size: var(--fs-small); color: var(--text-2); }
  .breakdown span:nth-child(5n+2), .breakdown span:nth-child(5n+4) { color: var(--text); text-align: right; }
  .breakdown span:nth-child(5n+3) { text-align: right; }
  .breakdown .ev { grid-column: 1 / -1; color: var(--text-3); padding-bottom: 8px; box-shadow: 0 1px 0 var(--surface-2); margin-bottom: 4px; }
  .bd-head { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 4px 14px; font-size: 12px; color: var(--text-3); }
  .bd-head span:not(:first-child) { text-align: right; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .links a { min-height: var(--tap); display: inline-flex; align-items: center; padding: 0 16px; border-radius: 24px; background: var(--surface-2);
    color: var(--accent); text-decoration: none; font-size: 15px; overflow-wrap: anywhere; }
  .links a:hover { background: var(--surface-3); }
  .links span { min-height: var(--tap); display: inline-flex; align-items: center; font-size: var(--fs-small); color: var(--text-3); }

  /* skip / help sheets */
  .reasons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .reasons .chip { justify-content: center; text-align: center; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .command { font-family: var(--font-mono); font-size: var(--fs-small); color: var(--text-2); background: var(--surface-2); border-radius: var(--radius-sm);
    padding: 12px; user-select: all; overflow-wrap: anywhere; }

  /* ranking settings */
  .rank-conflict { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; margin: 0; }
  .presets { display: flex; flex-wrap: wrap; gap: 8px; }
  .presets .chip:disabled { opacity: 1; cursor: default; color: var(--text-3); }
  .presets .chip:disabled[aria-pressed="true"] { color: var(--text); }
  #rank-sliders { display: flex; flex-direction: column; gap: 4px; }
  .slider-row { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; font-size: var(--fs-small); color: var(--text-2); }
  .slider-row span { color: var(--text); font-weight: 600; }
  .slider-row input[type=range] { grid-column: 1 / -1; width: 100%; min-height: 40px; }
  .num-label { font-size: var(--fs-small); color: var(--text-2); }
  .floor-row { display: grid; grid-template-columns: var(--tap) minmax(0, 1fr) var(--tap); gap: 8px; }
  .floor-row .btn { padding: 0; font-size: 22px; }
  .floor-row input { min-height: var(--tap); text-align: center; background: var(--surface-2); border: 0; border-radius: var(--radius-sm); font-size: var(--fs-body); font-weight: 600; width: 100%; }
  .bands-error { color: var(--danger); font-size: var(--fs-small); min-height: 18px; }
  .rank-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

  /* modules panel: which optional modules are on, and where to set each up */
  .modules-panel { background: var(--surface); border-radius: var(--radius); margin-bottom: 8px; }
  .modules-panel summary { min-height: var(--tap); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 16px;
    cursor: pointer; list-style: none; font-size: var(--fs-small); color: var(--text-2); }
  .modules-panel summary::-webkit-details-marker { display: none; }
  .modules-panel summary b { color: var(--text); font-weight: 600; margin-right: 4px; }
  .modules-panel .pill.on { color: var(--good); }
  .mod-note { margin: 0 16px 12px; padding: 8px 12px; border-radius: var(--radius-sm); background: var(--warn-soft); color: var(--warn);
    font-size: var(--fs-small); overflow-wrap: anywhere; }
  .mod-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 0 16px 16px; }
  .mod { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: baseline; font-size: var(--fs-small); }
  .mod .adds { grid-column: 2; color: var(--text-2); overflow-wrap: anywhere; }

  @media (min-width: 720px) {
    .mod-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .toolbar { flex-direction: row; align-items: center; }
    .toolbar .chips { flex: 1; margin: 0; padding: 0 0 2px; }
    .toolbar .search { flex: 0 0 280px; }
  }
  @media (min-width: 1180px) {
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <nav class="nav" aria-label="Pages"><a href="/jobs" aria-current="page">Jobs board</a></nav>
    <button class="rank-btn" id="rank-btn" type="button" aria-haspopup="dialog" aria-controls="rank-sheet">Ranking: Balanced (default settings)</button>
  </div>
</header>
<div class="banner error" id="error" role="alert" hidden></div>
<main>
  <details class="modules-panel" id="modules-panel" open hidden></details>
  <div class="toolbar">
    <div class="chips hscroll" id="chips" role="toolbar" aria-label="Filter leads"></div>
    <input class="search" id="search" type="search" placeholder="Search company or role" autocomplete="off" aria-label="Search company or role">
  </div>
  <div class="focus-row">
    <label for="focus">Focus</label>
    <select id="focus" aria-label="Focus the ranked board on one factor"></select>
    <button class="chip" id="top10" type="button" aria-pressed="false">Top 10 only</button>
  </div>
  <div id="sections" aria-live="polite"></div>
</main>

<div class="snacks" id="undo-stack"></div>
<div class="scrim" id="scrim" hidden></div>

<div class="sheet" id="lead-sheet" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="lead-title" hidden>
  <div class="grab" aria-hidden="true"></div><div class="content" id="lead-content"></div>
</div>

<div class="sheet" id="skip-sheet" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="skip-title" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div class="content">
    <h2 class="hero" id="skip-title" style="font-size:var(--fs-title)">Skip — why?</h2>
    <div class="field">
      <label for="skip-note">Note (optional, type it first, then tap a reason)</label>
      <textarea id="skip-note" maxlength="500" placeholder="What made this a no?"></textarea>
    </div>
    <div class="reasons" id="skip-reasons"></div>
    <div class="stack dupes" id="skip-dupes" hidden>
      <div class="small muted" id="skip-dupes-title">Duplicate of which lead?</div>
      <div class="stack" id="skip-dupes-list"></div>
    </div>
    <button class="btn" id="skip-cancel" type="button">Cancel</button>
  </div>
</div>

<div class="sheet" id="help-sheet" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="help-title" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div class="content">
    <h2 class="hero" id="help-title" style="font-size:var(--fs-title)">Need help</h2>
    <div class="stack">
      <button class="btn primary" id="help-prep" type="button">Draft prep pack</button>
      <button class="btn" id="help-copy" type="button">Copy terminal command</button>
      <div class="command" id="help-command"></div>
      <button class="btn ghost" id="help-cancel" type="button">Cancel</button>
    </div>
  </div>
</div>

<div class="sheet side" id="rank-sheet" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="rank-title" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div class="content">
    <div class="sheet-head"><h2 class="hero" id="rank-title" style="font-size:var(--fs-title)">Ranking settings</h2></div>
    <div class="banner warn rank-conflict" id="rank-conflict" hidden>Settings changed on another device. Your edits are kept here.
      <button class="btn sm" id="rank-reload" type="button">Reload settings</button></div>
    <section><h3>Preset</h3><div class="presets" id="rank-presets" role="group" aria-label="Preset"></div></section>
    <section><h3>Weights</h3><div id="rank-sliders"></div></section>
    <section>
      <label for="rank-floor" class="num-label">Annual base floor (verified pay below it caps the score)</label>
      <div class="floor-row">
        <button class="btn" id="rank-floor-minus" type="button" aria-label="Lower floor by $5,000">&minus;</button>
        <input id="rank-floor" type="text" inputmode="numeric" autocomplete="off" aria-label="Annual base floor">
        <button class="btn" id="rank-floor-plus" type="button" aria-label="Raise floor by $5,000">+</button>
      </div>
      <label for="rank-apply" class="num-label">"Apply now" starts at score</label>
      <div class="floor-row">
        <button class="btn" id="rank-apply-minus" type="button" aria-label="Lower by 5">&minus;</button>
        <input id="rank-apply" type="text" inputmode="numeric" autocomplete="off" aria-label="Apply now threshold">
        <button class="btn" id="rank-apply-plus" type="button" aria-label="Raise by 5">+</button>
      </div>
      <label for="rank-worth" class="num-label">"Worth a look" starts at score</label>
      <div class="floor-row">
        <button class="btn" id="rank-worth-minus" type="button" aria-label="Lower by 5">&minus;</button>
        <input id="rank-worth" type="text" inputmode="numeric" autocomplete="off" aria-label="Worth a look threshold">
        <button class="btn" id="rank-worth-plus" type="button" aria-label="Raise by 5">+</button>
      </div>
      <div class="bands-error" id="rank-bands-error" role="alert"></div>
    </section>
    <div class="rank-actions">
      <button class="btn ghost" id="rank-revert" type="button">Revert</button>
      <button class="btn" id="rank-close" type="button">Close</button>
      <button class="btn primary" id="rank-save" type="button">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="/jobs_scoring.js"></script>
<script src="/jobs.js"></script>
<script>
(function () {
  'use strict';
  const L = window.JobsLogic;
  const R = window.JobsScoring;
  const state = { leads: [], filter: null, query: '', expired: new Set(), sheetLead: null, pollTimer: null,
    busy: new Set(),            // lead ids with an action POST in flight (taps ignored, buttons disabled)
    seq: 0, floor: 0,           // request sequencing: a GET issued before the latest applied POST result is stale
    lastRefreshAt: -1e9,
    cards: new Map(), chipsSig: '', sectionsSig: '', undoSig: '', undoNodes: new Map(),
    detailId: null, detailSig: '',   // lead shown in the details sheet, and what it was last built from
    config: JSON.parse(JSON.stringify(R.DEFAULT_CONFIG)), draft: null, usingDefaults: true, configLoaded: false,
    ranked: [], placed: new Map(), rankPending: false, collapsed: new Set(['low']),
    leadsDir: null, dispatchEnabled: true, demo: false,
    focus: { key: '', top10: false } };   // Focus view: per browser, view-only (never sent to the server)
  state.draft = L.draftFromConfig(state.config);
  try { state.focus = L.parseFocusPref(window.localStorage.getItem(L.FOCUS_STORAGE_KEY)); } catch (_) { /* private window */ }
  function saveFocus() {
    try { window.localStorage.setItem(L.FOCUS_STORAGE_KEY, L.focusPrefString(state.focus)); } catch (_) { /* not saved: fine */ }
  }
  const $ = (id) => document.getElementById(id);
  let toastTimer = null;
  // Monotonic clock: elapsed time never depends on the phone's absolute clock.
  const now = () => performance.now();
  const BAND_ACTIONS = ['move_up', 'move_down', 'reset_band'];   // shown in the details sheet, not on the card

  // ---- DOM helpers: text only ever goes in through textContent ----------------
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function extLink(href, text) {
    const a = el('a', null, text);
    a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
    return a;
  }
  function button(label, cls, onClick) {
    const b = el('button', 'btn' + (cls ? ' ' + cls : ''), label);
    b.type = 'button';
    b.addEventListener('click', onClick);
    return b;
  }
  const SVG_NS = 'http://www.w3.org/2000/svg';
  function chevron(cls) {
    const s = document.createElementNS(SVG_NS, 'svg');
    s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor');
    s.setAttribute('stroke-width', '2'); s.setAttribute('aria-hidden', 'true'); s.setAttribute('class', cls || 'chev');
    const p = document.createElementNS(SVG_NS, 'path');
    p.setAttribute('d', cls === 'chev down' ? 'M6 9l6 6 6-6' : 'M9 18l6-6-6-6');
    s.appendChild(p);
    return s;
  }
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 4000);
  }
  function showError(msg) { const e = $('error'); e.textContent = msg; e.hidden = false; }

  // ---- API ----------------------------------------------------------------------
  async function api(method, path, body) {
    const opts = { method, headers: {} };
    if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    const res = await fetch(path, opts);
    let data = null;
    try { data = await res.json(); } catch (_) { data = null; }
    if (!res.ok) {
      const d = data && data.detail;
      const err = new Error(typeof d === 'string' ? d : (d ? JSON.stringify(d) : 'HTTP ' + res.status));
      err.status = res.status;
      throw err;
    }
    return data;
  }
  async function refresh() {
    const issued = ++state.seq;
    state.lastRefreshAt = now();
    try {
      const data = await api('GET', '/api/jobs/leads');
      // Stale: an action/undo/retry result landed after this GET was issued; it is newer than this list.
      if (issued > state.floor) state.leads = L.stampLeads(data.leads || [], now());
      if (data.leads_dir) state.leadsDir = data.leads_dir;
      if (typeof data.dispatch_enabled === 'boolean') state.dispatchEnabled = data.dispatch_enabled;
      if (typeof data.demo === 'boolean') state.demo = data.demo;
      $('error').hidden = true;
    } catch (e) {
      showError('Could not load leads: ' + e.message);
    }
    render();
    schedulePoll();
  }
  // focus and visibilitychange usually fire together; one refresh is enough.
  function refreshIfStale() { if (now() - state.lastRefreshAt > 1000) refresh(); }
  function schedulePoll() {
    clearTimeout(state.pollTimer);
    state.pollTimer = setTimeout(refresh, L.pollIntervalMs(state.leads));
  }
  function applyUpdate(updated) {
    state.floor = ++state.seq;
    state.leads = L.replaceLead(state.leads, updated, now());
    render();
    schedulePoll();
  }
  // One POST per lead at a time: further taps are ignored until it settles.
  async function post(leadId, path, body, failPrefix, okToast) {
    if (state.busy.has(leadId)) return;
    state.busy.add(leadId);
    renderSections();
    let updated = null;
    try { updated = await api('POST', '/api/jobs/leads/' + leadId + path, body); }
    catch (e) { toast((e.status === 409 ? 'Not now: ' : failPrefix + ': ') + e.message); }
    state.busy.delete(leadId);
    if (updated) { applyUpdate(updated); if (okToast) toast(okToast); }
    else refresh();
  }
  function send(lead, body) { closeSheets(); return post(lead.lead_id, '/action', body, 'Failed'); }
  function undo(leadId) { return post(leadId, '/undo', undefined, 'Undo failed', 'Undone'); }
  function retry(lead, grant) { return post(lead.lead_id, '/retry', { grant: !!grant }, 'Retry failed'); }

  // ---- rendering ----------------------------------------------------------------
  function settingsDirty() { return L.isDirty(state.draft, state.config); }
  function liveConfig() { return L.previewConfig(state.config, state.draft); }
  function rerank() { state.ranked = R.rankLeads(state.leads, liveConfig(), Date.now()); }
  function scheduleRerank() {                     // one re-score + re-order per frame while a slider moves
    if (state.rankPending) return;
    state.rankPending = true;
    requestAnimationFrame(() => { state.rankPending = false; rerank(); renderSections(); if (window.renderRankButton) window.renderRankButton(); });
  }
  function render() { rerank(); renderChips(); renderSections(); renderUndo(); }

  function renderChips() {
    const counts = L.countSections(state.leads);
    const sig = JSON.stringify([counts, state.filter]);
    if (sig === state.chipsSig) return;   // unchanged: keep the buttons a finger may be on
    state.chipsSig = sig;
    const box = $('chips');
    box.replaceChildren();
    L.SECTIONS.forEach((s) => {
      const b = el('button', 'chip', s.label + ' ');
      b.appendChild(el('span', 'of', String(counts[s.key])));
      b.type = 'button';
      b.setAttribute('aria-pressed', String(state.filter === s.key));
      b.addEventListener('click', () => { state.filter = state.filter === s.key ? null : s.key; render(); });
      box.appendChild(b);
    });
  }

  // Lead content that affects the DOM; the ticking countdown (undo_remaining_s, _receivedAt) is excluded
  // because the 1 s tick patches that text in place. r = the placed item (band/overridden/marked change the button set).
  function leadSig(lead, r) {
    const { undo_remaining_s, _receivedAt, ...rest } = lead;
    return JSON.stringify(rest) + (state.busy.has(lead.lead_id) ? '|busy' : '') + (undo_remaining_s == null ? '|n' : '|u')
      + '|' + (r ? r.band + r.overridden + r.marked : '') + '|' + settingsDirty() + '|' + state.dispatchEnabled + state.demo + '|' + state.focus.key
      + '|' + (L.duplicateBadge(lead, state.leads) || '');
  }
  const actOpts = () => ({ settingsDirty: settingsDirty(), dispatchEnabled: state.dispatchEnabled, demo: state.demo,
    focus: !!state.focus.key, leads: state.leads });
  const placedOf = (it) => (it && it.score ? it : null);
  const shown = (lead) => L.shownFor(state.placed.get(lead.lead_id) || null, settingsDirty());
  // Rebuild only when the visible structure changed, so buttons are never replaced under a finger.
  function renderSections() {
    const groups = L.groupLeads(state.leads, state.filter, state.query, state.ranked, liveConfig().bands, state.focus);
    const boardGroup = groups.find((g) => g.key === 'board');
    state.placed = new Map();
    if (boardGroup) (boardGroup.items || boardGroup.bands.flatMap((b) => b.items)).forEach((it) => state.placed.set(it.lead.lead_id, it));
    const bandsOf = (g) => g.bands || [{ key: '', items: g.items || g.leads.map((lead) => ({ lead })) }];
    // The score signature is part of the section signature so a re-score that keeps the order still reaches patchScore.
    const sig = JSON.stringify([settingsDirty(), state.focus, [...state.collapsed], ...groups.map((g) => [g.key, g.label, g.total, bandsOf(g).map((b) =>
      [b.key, b.items.map((it) => it.lead.lead_id + ':' + leadSig(it.lead, placedOf(it)) + ':' + L.scoreSig(placedOf(it)))])])]);
    if (sig !== state.sectionsSig) {
      state.sectionsSig = sig;
      buildSections(groups, bandsOf);
    }
    renderDetail();
  }
  function buildSections(groups, bandsOf) {
    const main = $('sections');
    const next = new Map();
    main.replaceChildren();
    const fillGrid = (grid, items) => {
      if (!items.length) grid.appendChild(el('p', 'empty-state', 'Nothing here.'));
      items.forEach((it) => {
        const l = it.lead;
        const r = placedOf(it);
        const s = leadSig(l, r);
        const ss = L.scoreSig(r);
        const cached = state.cards.get(l.lead_id);
        let node;
        if (cached && cached.sig === s) {
          node = cached.node;
          if (cached.scoreSig !== ss) patchScore(node, L.cardModel(l, r, state.focus.key));
        } else node = card(l, r);
        next.set(l.lead_id, { sig: s, scoreSig: ss, node: node });
        grid.appendChild(node);
      });
    };
    groups.forEach((g) => {
      const sec = el('section', 'section');
      const h = el('h2', 'section-title', g.label);
      h.appendChild(el('span', 'of', g.total != null && g.total !== g.leads.length ? g.leads.length + ' of ' + g.total : String(g.leads.length)));
      sec.appendChild(h);
      if (g.bands) {
        const items = new Map(g.bands.map((b) => [b.key, b.items]));
        L.bandHeaders(g, state.collapsed).forEach((hd) => {
          const head = el('button', 'band-head');
          head.appendChild(el('b', null, hd.label));
          head.appendChild(el('span', null, String(hd.count)));
          head.appendChild(chevron('chev down'));
          head.type = 'button';
          head.dataset.band = hd.key;
          head.setAttribute('aria-expanded', String(hd.expanded));
          head.addEventListener('click', () => {
            if (state.collapsed.has(hd.key)) state.collapsed.delete(hd.key); else state.collapsed.add(hd.key);
            renderSections();
          });
          sec.appendChild(head);
          const grid = el('div', 'grid');
          fillGrid(grid, items.get(hd.key) || []);
          sec.appendChild(grid);
        });
      } else {
        const grid = el('div', 'grid');
        fillGrid(grid, bandsOf(g)[0].items);
        sec.appendChild(grid);
      }
      main.appendChild(sec);
    });
    state.cards = next;
  }

  // Patches score badge, "why this rank" and the factor breakdown inside node (a card or the details sheet).
  function patchScore(node, m) {
    const badge = node.querySelector('[data-role=score]');
    if (badge) {
      const none = m.scoreText == null;
      badge.replaceChildren();
      if (!none && m.gated) badge.appendChild(el('span', 'lock', '🔒'));
      badge.appendChild(document.createTextNode(none ? '—' : (m.gated ? '≤' + m.scoreText : m.scoreText)));
      badge.className = 'score' + (none ? ' low' : m.colorBand === 'apply_now' ? '' : ' ' + m.colorBand);
      badge.setAttribute('aria-label', none ? 'no score' : 'score ' + m.scoreText + (m.rank ? ', rank ' + m.rank : '') + (m.gated ? ', capped by pay floor' : ''));
    }
    const wr = node.querySelector('[data-role=whyrank]');
    if (wr) wr.textContent = m.whyRank ? 'Why this rank: ' + m.whyRank : '';
    const fl = node.querySelector('[data-role=focus]');
    if (fl) {
      fl.replaceChildren();
      fl.hidden = !m.focus;
      if (m.focus) {
        fl.appendChild(el('b', null, m.focus.label + ' ' + m.focus.score));
        if (m.focus.evidence) fl.appendChild(document.createTextNode(' — ' + m.focus.evidence));
      }
    }
    const bd = node.querySelector('[data-role=breakdown]');
    if (bd) {
      bd.replaceChildren();
      m.breakdown.forEach((r) => {
        bd.appendChild(el('span', null, r.label));
        bd.appendChild(el('span', null, String(r.score)));
        bd.appendChild(el('span', null, r.pct + '%'));
        bd.appendChild(el('span', null, '+' + r.points));
        bd.appendChild(el('span', 'ev', r.evidence));
      });
    }
  }

  function titleBlock(lead, cls) {
    const t = lead.triage || {};
    const titles = el('div', 'titles');
    const role = el('div', 'role', t.role_title || 'Unknown role');
    if (cls) role.id = cls;
    titles.append(role, el('div', 'company', t.company || 'Unknown company'));
    return titles;
  }
  function scoreBadge() { const b = el('span', 'score'); b.dataset.role = 'score'; return b; }
  function metaLine(m) {
    const meta = el('div', 'meta');
    meta.appendChild(el('span', null, m.meta));
    if (m.pay) {
      meta.appendChild(el('span', 'pay ' + m.pay.kind, (m.meta ? ' · ' : '') + m.pay.text));
      if (m.pay.unspecified) meta.appendChild(el('span', 'pill warn', 'comp unspecified'));
    }
    return meta;
  }
  function badgesEl(lead, m) {
    const badges = el('div', 'badges');
    L.badgesFor(lead).forEach((b) => badges.appendChild(el('span', 'pill' + (b.charAt(0) === '↑' ? ' good' : ''), b)));
    if (m.movedByYou) badges.appendChild(el('span', 'pill accent', 'moved by you'));
    const dup = L.duplicateBadge(lead, state.leads);
    if (dup) badges.appendChild(el('span', 'pill warn', dup));
    return badges.childNodes.length ? badges : null;
  }
  function networkEl(lead) {
    const net = L.networkLine(lead);
    return net ? el('div', 'network' + (L.warmCurrentContact(lead) ? ' warm' : ''), net) : null;
  }
  function actionButtons(lead, acts, box) {
    let hint = null;
    acts.forEach((a) => {
      const cls = a.action === 'applied' ? 'primary' : (a.action === 'skip' ? 'danger' : '');
      const b = button(a.label, cls, () => onAction(lead, a));
      if (state.busy.has(lead.lead_id) || a.disabled) b.disabled = true;
      if (a.disabled && !hint) hint = a.hint;
      box.appendChild(b);
    });
    return hint;
  }

  // Card: the decision at a glance (score, role, where/pay, network, why) plus the main actions.
  // Everything else (fit, gap, your note, factor breakdown, links, band moves) is one tap away in the details sheet.
  function card(lead, ranked) {
    const d = lead.decision || {};
    const m = L.cardModel(lead, ranked, state.focus.key);
    const c = el('article', 'card lead' + (d.pending ? ' pending' : ''));
    const head = el('button', 'lead-head');
    head.type = 'button';
    head.setAttribute('aria-haspopup', 'dialog');
    head.append(scoreBadge(), titleBlock(lead), chevron());
    head.addEventListener('click', () => openDetail(lead.lead_id));
    c.appendChild(head);
    if (m.note) c.appendChild(el('div', 'note', m.note));
    if (ranked) { const fl = el('div', 'focusline'); fl.dataset.role = 'focus'; c.appendChild(fl); }
    c.appendChild(metaLine(m));
    if (m.summary) c.appendChild(el('div', 'summary', m.summary));
    const badges = badgesEl(lead, m);
    if (badges) c.appendChild(badges);
    const net = networkEl(lead);
    if (net) c.appendChild(net);
    if (ranked) { const wr = el('div', 'whyrank'); wr.dataset.role = 'whyrank'; c.appendChild(wr); }
    patchScore(c, m);

    const st = L.statusLine(lead, L.remainingSeconds(lead, now()));
    if (st) c.appendChild(statusEl(lead, st));

    const acts = L.actionsFor(lead, ranked, actOpts()).filter((a) => !BAND_ACTIONS.includes(a.action));
    const row = el('div', 'actions');
    actionButtons(lead, acts, row);
    const pl = L.postingLink(lead);   // the step right before "Applied", so it stays on the card
    if (pl.href) { const a = extLink(pl.href, 'Posting ↗'); a.className = 'btn ghost'; row.appendChild(a); }
    if (row.childNodes.length) c.appendChild(row);
    return c;
  }

  // Details sheet: the full lead. Rebuilt only when that lead's content or score changes.
  function renderDetail() {
    if (!state.detailId) return;
    const lead = state.leads.find((l) => l.lead_id === state.detailId);
    if (!lead) { closeSheets(); return; }
    const ranked = state.placed.get(lead.lead_id) || null;
    const sig = leadSig(lead, ranked) + '#' + L.scoreSig(ranked);
    if (sig === state.detailSig) return;
    state.detailSig = sig;
    const box = $('lead-content');
    box.replaceChildren();
    const m = L.cardModel(lead, ranked, state.focus.key);
    const head = el('div', 'detail-head');
    head.append(scoreBadge(), titleBlock(lead, 'lead-title'));
    const x = el('button', 'icon-btn');
    x.type = 'button'; x.setAttribute('aria-label', 'Close details');
    x.textContent = '✕';
    x.addEventListener('click', closeSheets);
    head.appendChild(x);
    box.appendChild(head);

    const top = el('section');
    if (m.note) top.appendChild(el('div', 'note', m.note));
    if (ranked) { const fl = el('div', 'focusline'); fl.dataset.role = 'focus'; top.appendChild(fl); }
    top.appendChild(metaLine(m));
    const badges = badgesEl(lead, m);
    if (badges) top.appendChild(badges);
    if (m.summary) top.appendChild(el('div', 'summary', m.summary));
    const net = networkEl(lead);
    if (net) top.appendChild(net);
    const st = L.statusLine(lead, L.remainingSeconds(lead, now()));
    if (st) top.appendChild(statusEl(lead, st));
    box.appendChild(top);

    const fitSec = el('section');
    const fit = (label, text) => { const f = el('div', 'fit'); f.appendChild(el('b', null, label)); f.appendChild(document.createTextNode(text)); fitSec.appendChild(f); };
    if (m.yourNote) fit('Your note', m.yourNote);
    if (m.fit) fit(ranked ? 'Why you fit' : 'Old triage', m.fit);
    if (m.gap) fit('Main gap', m.gap);
    if (fitSec.childNodes.length) box.appendChild(fitSec);

    if (ranked) {
      const why = el('section');
      const wr = el('div', 'summary'); wr.dataset.role = 'whyrank'; why.appendChild(wr);
      const bh = el('div', 'bd-head');
      ['Factor', 'Score', 'Weight', 'Points'].forEach((t) => bh.appendChild(el('span', null, t)));
      why.appendChild(bh);
      const bd = el('div', 'breakdown'); bd.dataset.role = 'breakdown'; why.appendChild(bd);
      box.appendChild(why);
    }
    patchScore(box, m);

    const links = el('div', 'links');
    const pl = L.postingLink(lead);
    links.appendChild(pl.href ? extLink(pl.href, pl.label) : el('span', null, pl.label));
    const eng = L.engageLink(lead);
    if (eng) links.appendChild(extLink(eng.href, eng.label));
    box.appendChild(links);

    const acts = L.actionsFor(lead, ranked, actOpts());
    if (acts.length) {
      const sec = el('section');
      const row = el('div', 'actions');
      const hint = actionButtons(lead, acts, row);
      sec.appendChild(row);
      if (hint) sec.appendChild(el('div', 'move-hint', hint));
      box.appendChild(sec);
    }
  }
  function openDetail(id) {
    state.detailId = id; state.detailSig = '';
    renderDetail();
    openSheet('lead-sheet', state.leads.find((l) => l.lead_id === id) || null);
  }

  function statusEl(lead, st) {
    const s = el('div', 'status ' + st.kind);
    if (st.kind === 'pending') s.dataset.countdown = lead.lead_id;
    s.appendChild(st.href ? extLink(st.href, st.text) : el('span', null, st.text));
    const busy = state.busy.has(lead.lead_id);
    if (st.button === 'retry') { const b = button('Retry', '', () => retry(lead, false)); b.disabled = busy; s.appendChild(b); }
    if (st.button === 'grant') { const b = button('Grant', '', () => retry(lead, true)); b.disabled = busy; s.appendChild(b); }
    return s;
  }

  function renderUndo() {
    const bars = L.undoBars(state.leads, now());
    const sig = bars.map((u) => u.lead_id + '|' + u.label).join('\n');
    if (sig !== state.undoSig) {   // set of bars changed: rebuild; otherwise only the text is patched
      state.undoSig = sig;
      state.undoNodes = new Map();
      const box = $('undo-stack');
      box.replaceChildren();
      bars.forEach((u) => {
        const bar = el('div', 'snack');
        bar.setAttribute('role', 'status');
        const label = el('span', null, '');
        bar.appendChild(label);
        bar.appendChild(button('Undo', '', () => undo(u.lead_id)));
        box.appendChild(bar);
        state.undoNodes.set(u.lead_id, label);
      });
      document.body.classList.toggle('has-snacks', bars.length > 0);
    }
    bars.forEach((u) => { state.undoNodes.get(u.lead_id).textContent = u.label + ' · ' + L.formatCountdown(u.remaining); });
  }

  // Once a second: undo bars and pending status lines only (no full re-render, so scroll/expansion survive).
  function tick() {
    renderUndo();
    document.querySelectorAll('[data-countdown]').forEach((node) => {
      const lead = state.leads.find((l) => l.lead_id === node.dataset.countdown);
      const st = lead && L.statusLine(lead, L.remainingSeconds(lead, now()));
      if (st && node.firstChild) node.firstChild.textContent = st.text;
      if (lead && L.remainingSeconds(lead, now()) === 0 && !state.expired.has(lead.lead_id)) {
        state.expired.add(lead.lead_id); refresh(); // window closed: let the server sweep it
      }
    });
  }

  // ---- sheets & actions ---------------------------------------------------------
  // One sheet at a time: unhide, then add .on next frame so it slides; hide after the slide out.
  const SHEETS = ['lead-sheet', 'skip-sheet', 'help-sheet', 'rank-sheet'];
  const sheetUi = { last: null, raf: 0, hideTimer: 0 };
  function onAction(lead, a) {
    const action = a.action;
    // One-tap skips carry their own reason (Confirm closed, Skip as duplicate); JSON drops an undefined duplicate_of.
    if (action === 'skip' && a.reason) return send(lead, { action: 'skip', reason: a.reason, note: a.note || null,
      duplicate_of: a.duplicate_of || undefined, shown: shown(lead) });
    if (action === 'skip') return openSheet('skip-sheet', lead);
    if (action === 'help') return openSheet('help-sheet', lead);
    send(lead, { action: action, shown: shown(lead) });   // move_up, move_down, reset_band, still_open, applied: the Undo bar covers mistakes
  }
  function openSheet(id, lead) {
    if (lead) state.sheetLead = lead;
    const company = lead ? ((lead.triage || {}).company || 'this lead') : '';
    if (id === 'skip-sheet') {
      $('skip-title').textContent = 'Skip ' + company + ' — why?'; $('skip-note').value = '';
      $('skip-dupes').hidden = true; $('skip-reasons').hidden = false;
    }
    if (id === 'help-sheet') { $('help-title').textContent = 'Need help — ' + company; $('help-command').textContent = L.terminalCommand(lead, state.leadsDir); }
    if (id !== 'lead-sheet') state.detailId = null;
    const open = SHEETS.find((s) => !$(s).hidden);
    if (!open) sheetUi.last = document.activeElement;
    SHEETS.forEach((s) => { if (s !== id) { $(s).classList.remove('on'); $(s).hidden = true; } });
    clearTimeout(sheetUi.hideTimer);
    cancelAnimationFrame(sheetUi.raf);
    $('scrim').classList.toggle('light', $(id).classList.contains('side'));
    $('scrim').hidden = false; $(id).hidden = false;
    if (open && open !== id) $(id).classList.add('on');           // swapping sheets: no second slide
    sheetUi.raf = requestAnimationFrame(() => { $('scrim').classList.add('on'); $(id).classList.add('on'); });
    setTimeout(() => $(id).focus({ preventScroll: true }), 50);
  }
  function closeSheets() {
    state.detailId = null; state.detailSig = '';
    if (SHEETS.every((s) => $(s).hidden)) return;
    cancelAnimationFrame(sheetUi.raf);
    $('scrim').classList.remove('on');
    SHEETS.forEach((s) => $(s).classList.remove('on'));
    const done = () => { $('scrim').hidden = true; SHEETS.forEach((s) => { $(s).hidden = true; }); };
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) done(); else sheetUi.hideTimer = setTimeout(done, 250);
    if (sheetUi.last && sheetUi.last.focus && document.contains(sheetUi.last)) sheetUi.last.focus({ preventScroll: true });
  }
  function buildSkipReasons() {
    const box = $('skip-reasons');
    L.SKIP_REASONS.forEach((r) => {
      const b = el('button', 'chip', r.label);
      b.type = 'button';
      b.addEventListener('click', () => {
        const lead = state.sheetLead;
        if (!lead) return;
        const note = $('skip-note').value.trim();
        if (r.key === L.DUPLICATE) return showDupePicker(lead, note);
        send(lead, { action: 'skip', reason: r.key, note: note || null, shown: shown(lead) });
      });
      box.appendChild(b);
    });
  }
  // "Duplicate / already applied": pick which same-company lead this one repeats (optional), then skip.
  function showDupePicker(lead, note) {
    const options = L.sameCompanyLeads(state.leads, lead);
    const skip = (dupOf) => send(lead, { action: 'skip', reason: L.DUPLICATE, note: note || null,
      duplicate_of: dupOf || undefined, shown: shown(lead) });
    if (!options.length) return skip(null);
    const list = $('skip-dupes-list');
    list.replaceChildren();
    options.forEach((o) => list.appendChild(button(o.label + (o.applied ? ' (applied)' : '') + (o.flagged ? ' — flagged' : ''),
      o.flagged ? 'primary' : '', () => skip(o.lead_id))));
    list.appendChild(button('Not linked to a lead', 'ghost', () => skip(null)));
    $('skip-reasons').hidden = true;
    $('skip-dupes').hidden = false;
  }
  // ---- Focus view: view-only, saved per browser; never posts anything ------------------
  function renderFocusControls() {
    const sel = $('focus');
    if (!sel.options.length) {
      L.FOCUS_OPTIONS.forEach((f) => { const o = document.createElement('option'); o.value = f.key; o.textContent = f.label; sel.appendChild(o); });
    }
    sel.value = state.focus.key;
    $('top10').setAttribute('aria-pressed', String(state.focus.top10));
  }
  function setFocus(next) {
    state.focus = L.normalizeFocus(next);
    saveFocus();
    renderFocusControls();
    renderSections();
  }
  $('focus').addEventListener('change', (e) => setFocus({ ...state.focus, key: e.target.value }));
  $('top10').addEventListener('click', () => setFocus({ ...state.focus, top10: !state.focus.top10 }));
  renderFocusControls();
  // Plain http over a private network is not a secure context: navigator.clipboard is missing on a phone.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => toast('Copied: ' + text), () => fallbackCopy(text));
      return;
    }
    fallbackCopy(text);
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
    ta.remove();
    if (ok) toast('Copied: ' + text); else window.prompt('Copy this command:', text);
  }

  // ---- ranking settings drawer ----------------------------------------------------
  async function loadConfig() {
    try {
      const r = await api('GET', '/api/jobs/scoring-config');
      state.config = r.config; state.draft = L.draftFromConfig(r.config);
      state.usingDefaults = false; state.configLoaded = true;
      if (r.warning) toast(r.warning);
    } catch (e) {
      state.usingDefaults = true;      // keep scoring with the embedded defaults; never an empty board
      toast('Ranking settings unavailable — using default settings (' + e.message + ')');
    }
    $('rank-conflict').hidden = true;
    renderDrawer(); render();
  }
  function renderRankButton() {
    const b = $('rank-btn');
    b.textContent = L.rankButtonText({ draft: state.draft, config: state.config, usingDefaults: state.usingDefaults, dirty: settingsDirty() });
    b.title = b.textContent;
    b.classList.toggle('dirty', settingsDirty());
  }
  window.renderRankButton = renderRankButton;
  function renderDrawer() {
    const active = L.presetFor(state.draft, state.config.presets);
    const pBox = $('rank-presets');
    pBox.replaceChildren();
    Object.keys(state.config.presets).concat(['Custom']).forEach((name) => {
      const b = el('button', 'chip', name);
      b.type = 'button';
      b.setAttribute('aria-pressed', String((active || 'Custom') === name));
      b.disabled = name === 'Custom';
      b.addEventListener('click', () => {
        state.draft = { ...state.draft, weights: L.draftFromConfig({ ...state.config, active_weights: state.config.presets[name] }).weights };
        renderDrawer(); scheduleRerank();
      });
      pBox.appendChild(b);
    });
    const sBox = $('rank-sliders');
    if (!sBox.childNodes.length) {
      R.FACTORS.forEach((f) => {
        const row = el('div', 'slider-row');
        const lab = el('label', null, f.label);
        lab.htmlFor = 'w-' + f.key;
        const out = el('span', null, '');
        out.dataset.pct = f.key;
        const inp = document.createElement('input');
        inp.type = 'range'; inp.min = '0'; inp.max = '100'; inp.step = '1'; inp.id = 'w-' + f.key;
        inp.addEventListener('input', () => {
          state.draft = { ...state.draft, weights: { ...state.draft.weights, [f.key]: Number(inp.value) } };
          renderDrawerNumbers(); scheduleRerank();
        });
        row.append(lab, out, inp);
        sBox.appendChild(row);
      });
    }
    R.FACTORS.forEach((f) => { $('w-' + f.key).value = String(state.draft.weights[f.key]); });
    renderDrawerNumbers();
  }
  function renderDrawerNumbers() {
    const pct = L.percentages(state.draft.weights);
    document.querySelectorAll('[data-pct]').forEach((n) => { n.textContent = pct[n.dataset.pct] + '%'; });
    const active = L.presetFor(state.draft, state.config.presets) || 'Custom';
    $('rank-presets').querySelectorAll('.chip').forEach((b) => b.setAttribute('aria-pressed', String(b.textContent === active)));
    if (document.activeElement !== $('rank-floor')) $('rank-floor').value = L.formatMoney(state.draft.floor);
    if (document.activeElement !== $('rank-apply')) $('rank-apply').value = String(state.draft.bands.apply_now_min);
    if (document.activeElement !== $('rank-worth')) $('rank-worth').value = String(state.draft.bands.worth_a_look_min);
    const problem = L.bandsProblem(state.draft, state.config.compensation_settings.hard_gate_clamp_ceiling);
    const zeroWeights = Object.values(state.draft.weights).reduce((a, b) => a + (Number(b) || 0), 0) <= 0;
    $('rank-bands-error').textContent = problem || (zeroWeights ? 'Set at least one weight above 0' : (state.configLoaded ? '' : 'Settings not loaded — changes preview only'));
    $('rank-save').disabled = !!problem || zeroWeights || !state.configLoaded;
    renderRankButton();
  }
  function setFloor(v) { state.draft = { ...state.draft, floor: v }; renderDrawerNumbers(); scheduleRerank(); }
  function setBand(key, v) {
    state.draft = { ...state.draft, bands: { ...state.draft.bands, [key]: Math.min(100, Math.max(1, v)) } };
    renderDrawerNumbers(); scheduleRerank();
  }
  [['rank-apply', 'apply_now_min'], ['rank-worth', 'worth_a_look_min']].forEach(([id, key]) => {
    $(id + '-minus').addEventListener('click', () => setBand(key, L.stepThreshold(state.draft.bands[key], -1)));
    $(id + '-plus').addEventListener('click', () => setBand(key, L.stepThreshold(state.draft.bands[key], 1)));
    $(id).addEventListener('change', () => setBand(key, Number(String($(id).value).replace(/[^0-9]/g, '')) || state.draft.bands[key]));
  });
  $('rank-floor-minus').addEventListener('click', () => setFloor(L.stepFloor(state.draft.floor, -1)));
  $('rank-floor-plus').addEventListener('click', () => setFloor(L.stepFloor(state.draft.floor, 1)));
  $('rank-floor').addEventListener('change', () => {
    const n = Number(String($('rank-floor').value).replace(/[^0-9]/g, ''));
    setFloor(Math.min(1000000, Math.max(10000, n || state.draft.floor)));
  });
  $('rank-revert').addEventListener('click', () => { state.draft = L.draftFromConfig(state.config); renderDrawer(); scheduleRerank(); });
  $('rank-reload').addEventListener('click', () => { loadConfig(); });   // explicit: discards the edits
  $('rank-btn').addEventListener('click', () => openSheet('rank-sheet'));
  $('rank-close').addEventListener('click', closeSheets);
  $('rank-save').addEventListener('click', async () => {
    const body = { expected_version: state.config.version, active_preset: L.presetFor(state.draft, state.config.presets),
      active_weights: state.draft.weights, compensation_settings: { annual_base_floor: state.draft.floor }, bands: state.draft.bands };
    try {
      const r = await api('POST', '/api/jobs/scoring-config', body);
      state.config = r.config; state.draft = L.draftFromConfig(r.config);
      $('rank-conflict').hidden = true;
      toast('Ranking saved'); renderDrawer(); scheduleRerank();
    } catch (e) {
      const out = L.settingsSaveOutcome(e.status || 0);
      if (out === 'conflict') $('rank-conflict').hidden = false;          // edits stay; Reload is the user's choice
      else toast((out === 'invalid' ? 'Not saved: ' : 'Save failed: ') + e.message);
    }
  });

  // ---- modules panel ------------------------------------------------------------
  async function loadModules() {
    let health = null;
    try { health = await api('GET', '/api/health'); } catch (_) { return; }
    const p = L.modulesPanel(health);
    const box = $('modules-panel');
    box.replaceChildren();
    const sum = el('summary');
    sum.appendChild(el('b', null, 'Modules'));
    p.items.forEach((m) => { const pill = el('span', 'pill' + (m.enabled ? ' on' : ''), m.enabled ? 'on' : 'off'); pill.title = m.label; sum.appendChild(pill); });
    box.appendChild(sum);
    if (p.note) box.appendChild(el('div', 'mod-note', p.note));
    const list = el('div', 'mod-list');
    p.items.forEach((m) => {
      const row = el('div', 'mod');
      row.appendChild(el('span', 'pill' + (m.enabled ? ' on' : ''), m.enabled ? 'on' : 'off'));
      const name = el('span');
      name.appendChild(extLink(m.href, m.label));
      row.appendChild(name);
      row.appendChild(el('span', 'adds', m.adds));
      list.appendChild(row);
    });
    box.appendChild(list);
    if (window.matchMedia && window.matchMedia('(max-width: 767px)').matches && !p.demo) box.open = false;
    box.hidden = false;
  }

  // ---- wiring -------------------------------------------------------------------
  buildSkipReasons();
  $('skip-cancel').addEventListener('click', closeSheets);
  $('help-cancel').addEventListener('click', closeSheets);
  $('scrim').addEventListener('click', closeSheets);
  $('help-prep').addEventListener('click', () => { if (state.sheetLead) send(state.sheetLead, { action: 'prep', shown: shown(state.sheetLead) }); });
  $('help-copy').addEventListener('click', () => {
    const lead = state.sheetLead;
    if (!lead) return;
    copyText(L.terminalCommand(lead, state.leadsDir)); // synchronously inside the tap, before any await
    send(lead, { action: 'terminal', shown: shown(lead) });
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheets(); });
  $('search').addEventListener('input', (e) => { state.query = e.target.value; renderSections(); });
  window.addEventListener('focus', refreshIfStale);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshIfStale(); });
  setInterval(tick, 1000);
  renderDrawer();
  refresh();
  loadConfig();
  loadModules();
})();
</script>
</body>
</html>
